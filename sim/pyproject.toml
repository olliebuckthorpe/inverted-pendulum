[project]
name = "pendulum-sim"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cobs>=1.2.2",
    "control>=0.10.2",
    "gymnasium[mujoco]>=1.3.0",
    "matplotlib>=3.11.2",
    "mujoco>=3.14.0",
    "numpy>=2.5.3",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "stable-baselines3>=2.9.0",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
